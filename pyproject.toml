[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "0.1.0"
description = "SOAR-style triage of suspicious emails (.eml): header analysis, lookalike domains, IOC extraction, attachment hashing, transparent scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
enrich = ["requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
phish-triage = "phish_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phish_triage = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
